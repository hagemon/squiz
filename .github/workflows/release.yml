name: Build and publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Signed Android release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SQUIZ_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/squiz-release.jks"
          chmod 600 "$RUNNER_TEMP/squiz-release.jks"

      - name: Test, lint, and build signed APK
        env:
          SQUIZ_STORE_FILE: ${{ runner.temp }}/squiz-release.jks
          SQUIZ_STORE_PASSWORD: ${{ secrets.SQUIZ_STORE_PASSWORD }}
          SQUIZ_KEY_ALIAS: squiz-release
          SQUIZ_KEY_PASSWORD: ${{ secrets.SQUIZ_KEY_PASSWORD }}
        run: |
          test -n "$SQUIZ_STORE_PASSWORD"
          test -n "$SQUIZ_KEY_PASSWORD"
          ./gradlew --no-daemon testReleaseUnitTest lintRelease assembleRelease

      - name: Verify tag, APK, and signature
        id: apk
        shell: bash
        run: |
          SOURCE_APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$SOURCE_APK"

          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$SOURCE_APK"

          APK_VERSION="$("$BUILD_TOOLS/aapt" dump badging "$SOURCE_APK" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          test -n "$APK_VERSION"
          if [[ "$APK_VERSION" != "$TAG_VERSION" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match APK version $APK_VERSION" >&2
            exit 1
          fi

          RELEASE_FILE="squiz-${APK_VERSION}.apk"
          cp "$SOURCE_APK" "$RUNNER_TEMP/$RELEASE_FILE"
          (cd "$RUNNER_TEMP" && sha256sum "$RELEASE_FILE" > "$RELEASE_FILE.sha256")
          echo "version=$APK_VERSION" >> "$GITHUB_OUTPUT"
          echo "file=$RUNNER_TEMP/$RELEASE_FILE" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          APK_FILE: ${{ steps.apk.outputs.file }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "$APK_FILE" \
            "$APK_FILE.sha256" \
            --verify-tag \
            --title "Squiz ${{ steps.apk.outputs.version }}" \
            --generate-notes

      - name: Remove temporary keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/squiz-release.jks"
